name: Project 3 - CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  LAMBDA_FUNCTION: get-certificate
  PROJECT3_REPO: sreejar3011/Employee-Learning-and-skill-certificate-Tracker

jobs:

  build:
    name: Build Project 3 Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CI/CD repository
        uses: actions/checkout@v4

      - name: Checkout Project 3 source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROJECT3_REPO }}
          path: project3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: project3
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3 reportlab

      - name: Build Lambda package
        working-directory: project3
        run: |
          rm -rf lambda-package
          mkdir -p lambda-package

          cp backend/certificates/get_certificate/lambda_function.py lambda-package/
          cp backend/certificates/utils.py lambda-package/

          pip install boto3 reportlab -t lambda-package

          cd lambda-package
          zip -r ../get-certificate.zip .

      - name: Verify deployment package
        working-directory: project3
        run: |
          unzip -l get-certificate.zip
          test -f get-certificate.zip

  test:
    name: Test Project 3
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout CI/CD repository
        uses: actions/checkout@v4

      - name: Checkout Project 3 source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROJECT3_REPO }}
          path: project3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        working-directory: project3
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3 reportlab

      - name: Run get-certificate tests
        working-directory: project3/backend/certificates
        run: |
          pytest tests/test_get_certificate.py -v

  deploy:
    name: Deploy get-certificate Lambda
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout CI/CD repository
        uses: actions/checkout@v4

      - name: Checkout Project 3 source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROJECT3_REPO }}
          path: project3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'



      - name: Build deployment package
        working-directory: project3
        run: |
          rm -rf lambda-package
          mkdir -p lambda-package

          cp backend/certificates/get_certificate/lambda_function.py lambda-package/
          cp backend/certificates/utils.py lambda-package/

          pip install boto3 reportlab -t lambda-package

          cd lambda-package
          zip -r ../get-certificate.zip .

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::280710007814:role/GitHubActions-ProdHardngCostOpt-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy Lambda
        working-directory: project3
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --zip-file fileb://get-certificate.zip \
            --region ${{ env.AWS_REGION }}

      - name: Verify Lambda deployment
        run: |
          aws lambda get-function \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Configuration.[FunctionName,Runtime,Handler,LastModified]' \
            --output table
